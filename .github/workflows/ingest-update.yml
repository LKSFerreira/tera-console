# EXPERIMENTAL: rascunho bruto da API (nao publica no portal).
# Digite LAB no input confirm_lab para rodar.
# Preferir workflow Detect (so radar via Issue).

name: Experimental raw ingest (lab only)

on:
  workflow_dispatch:
    inputs:
      news_ref:
        description: "News ID (ex. 1018) ou URL - rascunho bruto, nao publica"
        required: true
        type: string
      confirm_lab:
        description: "Digite LAB para confirmar que isto nao publica no site"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: experimental-raw-ingest
  cancel-in-progress: false

jobs:
  raw-ingest:
    name: Raw draft only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.confirm_lab == 'LAB'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest as draft (never published)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model / ranking: Variables preferidas; Secrets tambem funcionam se voce cadastrou la
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || secrets.OPENROUTER_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
          OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL || secrets.OPENROUTER_SITE_URL || '' }}
          OPENROUTER_APP_NAME: ${{ vars.OPENROUTER_APP_NAME || secrets.OPENROUTER_APP_NAME || 'tera-console-portal-localize' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::Sem GEMINI_API_KEY nem OPENROUTER_API_KEY - traducao so com labels (corpo EN)."
          else
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "Gemini configurado (modelo: ${GEMINI_MODEL})"
            fi
            if [ -n "$OPENROUTER_API_KEY" ]; then
              echo "OpenRouter configurado (fallback/primario: ${OPENROUTER_MODEL})"
              echo "OpenRouter app: ${OPENROUTER_APP_NAME:-default}"
            else
              echo "::warning::OPENROUTER_API_KEY ausente - sem fallback free se Gemini falhar."
            fi
          fi
          npm run ingest:update -- --url "${{ inputs.news_ref }}"

      - name: Create draft PR (DO NOT merge as product content)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ":warning: data: rascunho bruto de ingest (nao publicar no portal)"
          title: "WIP/EXPERIMENTAL: rascunho bruto `${{ inputs.news_ref }}` - nao mergear como conteudo final"
          body: |
            ## Rascunho experimental - nao e conteudo do portal

            Referencia: `${{ inputs.news_ref }}`

            ### Politica
            - O portal so publica conteudo no padrao B131 (curadoria).
            - Este PR e rascunho da API/parser - nao mergear na main como patch pronto.
            - Use so como referencia para curadoria manual.

            Se abriu por engano: feche o PR sem merge.
          branch: lab/raw-ingest
          delete-branch: true
          draft: true
          labels: experimental, do-not-merge, content
          add-paths: |
            src/content/sources/**
