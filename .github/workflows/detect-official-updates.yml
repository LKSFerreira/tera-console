# Radar: detecta UPDATES oficiais e abre Issue.
# Nao publica no portal. Curadoria B131 continua manual.
# Cron: a cada ~3 dias + Run workflow manual.

name: Detect official updates

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: detect-official-updates
  cancel-in-progress: false

jobs:
  detect:
    name: Detect and open issue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect new updates
        id: detect
        run: npx tsx scripts/detect-new-updates.ts --json --github-output

      - name: Nothing new
        if: steps.detect.outputs.count == '0'
        run: echo "Nenhum UPDATE faltando no portal."

      - name: Create tracking issue
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ steps.detect.outputs.payload }}
          IDS: ${{ steps.detect.outputs.ids }}
          COUNT: ${{ steps.detect.outputs.count }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          npx tsx scripts/format-radar-issue.ts > "$BODY_FILE"
          gh label create "content" --description "Radar / conteudo de patch" --color "1D76DB" 2>/dev/null || true
          gh label create "radar" --description "Detect oficial" --color "0E8A16" 2>/dev/null || true
          gh issue create \
            --title "Radar: ${COUNT} update(s) pendente(s) - ${IDS}" \
            --body-file "$BODY_FILE" \
            --label "content" \
            --label "radar"
