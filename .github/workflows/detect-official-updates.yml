# RADAR apenas: detecta UPDATES oficiais e abre Issue.
# NÃO ingere conteúdo no portal. NÃO publica patch notes.
# Cadência: a cada ~3 dias (~5×/quinzena) + dispatch manual.
#
# Setup (uma vez): Settings → Actions → Workflow permissions
#   → Read and write (issues) / Allow creating issues via Actions

name: Detect official updates

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: detect-official-updates
  cancel-in-progress: false

jobs:
  detect:
    name: Detect + open issue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect new updates
        id: detect
        run: npx tsx scripts/detect-new-updates.ts --json --github-output

      - name: Nothing new
        if: steps.detect.outputs.count == '0'
        run: echo "Nenhum UPDATE novo."

      - name: Create tracking issue
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ steps.detect.outputs.payload }}
          IDS: ${{ steps.detect.outputs.ids }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          {
            echo "## Radar de UPDATE oficial"
            echo ""
            echo "Foram detectados **${{ steps.detect.outputs.count }}** UPDATE(s) novos em \`api.tera-console.com\`."
            echo ""
            echo "> **Política de qualidade:** isto **não** publica conteúdo no portal."
            echo "> O site só aceita patch no padrão **B131** (curadoria humana)."
            echo "> Ingest automático bruto **não** deve ir para \`order\` / produção."
            echo ""
            echo "### Itens"
            echo ""
            echo '```json'
            echo "$PAYLOAD" | jq -c '.items // .'
            echo '```'
            echo ""
            echo "### IDs"
            echo "\`${IDS}\`"
            echo ""
            echo "### Próximos passos (maintainer)"
            echo "- [ ] Abrir o(s) link(s) oficiais e ler o patch"
            echo "- [ ] Curar no padrão visual/editorial B131 (pt-BR + estrutura de cards)"
            echo "- [ ] Só então publicar (\`meta.status: published\` + \`index.order\`)"
            echo ""
            echo "_Issue gerada pelo workflow \`detect-official-updates\` (cron ~3 dias)._"
          } > "$BODY_FILE"

          gh issue create \
            --title "Radar: UPDATE(s) oficial(is) pendente(s) de curadoria (${IDS})" \
            --body-file "$BODY_FILE" \
            --label "content" \
            || gh issue create \
              --title "Radar: UPDATE(s) oficial(is) pendente(s) de curadoria (${IDS})" \
              --body-file "$BODY_FILE"
