# =============================================================================
# DESATIVADO (2026-07-23) - modelo preservado para reuso em outros projetos
# =============================================================================
# Motivo: o radar por GitHub Issue foi abandonado neste portal.
# Gate de qualidade passa a ser o PR de merge para main (markdown, links,
# checkboxes, Preview Vercel). Ver politica e github_actions_conteudo.md.
#
# Para reativar noutro projeto / no futuro:
# 1. Restaurar o bloco `on.schedule` abaixo
# 2. Remover `if: false` do job
# 3. Ajustar assignee / labels se preciso
#
# Scripts relacionados (nao apagar):
#   scripts/detect-new-updates.ts
#   scripts/format-radar-issue.ts  (template markdown reutilizavel em PR)
# =============================================================================

name: Detect official updates (DISABLED - issue radar)

# Sem cron. workflow_dispatch mantido so para o ficheiro continuar valido no
# GitHub; o job esta com if: false e nao cria Issues.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Workflow desativado de proposito. Nao cria Issues. Modelo preservado."
        required: false
        default: "disabled"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: detect-official-updates
  cancel-in-progress: false

jobs:
  detect:
    name: Detect and open issue (disabled)
    # Hard off: job nunca corre ate alguem remover este if.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Runtime do job (tsx/npm). As actions em si rodam em Node 24 no v5.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect new updates
        id: detect
        run: npx tsx scripts/detect-new-updates.ts --json --github-output

      - name: Nothing new
        if: steps.detect.outputs.count == '0'
        run: echo "Nenhum UPDATE faltando no portal."

      - name: Create tracking issue
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD: ${{ steps.detect.outputs.payload }}
          IDS: ${{ steps.detect.outputs.ids }}
          COUNT: ${{ steps.detect.outputs.count }}
          # Dono do repo = assignee + mencao (notificacao)
          ISSUE_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          npx tsx scripts/format-radar-issue.ts > "$BODY_FILE"

          gh label create "content" --description "Radar / conteudo de patch" --color "1D76DB" 2>/dev/null || true
          gh label create "radar" --description "Detect oficial" --color "0E8A16" 2>/dev/null || true

          # Labels + te atribui (Assignee) para aparecer em "Assigned to you" e notificar
          gh issue create \
            --title "Radar: ${COUNT} update(s) pendente(s) - ${IDS}" \
            --body-file "$BODY_FILE" \
            --label "content" \
            --label "radar" \
            --assignee "${ISSUE_ASSIGNEE}"
